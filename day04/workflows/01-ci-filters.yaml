name: 06 - Prod Workflow Trigger
on:
  push:
    branches:
      - "develop"
      - "feature/*"

    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/**"

#both branches and paths must satisfy - they work in AND Fashion

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - ready_for_review
    branches:
      - "main"

#both types and branches must satisfy - they work in AND Fashion

jobs:
  validation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Workflow Context
        run: |
          echo "Workflow Triggered Successfully"
          echo "Event Type: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Owner: $GITHUB_REPOSITORY_OWNER"
